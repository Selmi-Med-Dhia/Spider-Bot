; SpiderBot ESP32 controller
; Uses a PCA9685 16-channel servo driver and WebSocket control.

[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    links2004/WebSockets
    adafruit/Adafruit PWM Servo Driver Library
    bblanchon/ArduinoJson

build_flags =
    -DCORE_DEBUG_LEVEL=1
